<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Created by SeihyouMirai -->
  <meta charset="UTF-8">
  <title>Discord Profile Customize Tool</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      background-color: #1e1f22;
      color: #f2f3f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-sizing: border-box;
      max-height: 720px;
      overflow-y: auto;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      border-bottom: 1px solid #35363c;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #badgeList {
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #enabledBadgeOrder {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 14px;
      padding: 10px;
      min-height: 34px;
      background: #232428;
      border: 1px solid #35363c;
      border-radius: 8px;
    }

    .order-badge {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: #2b2d31;
      border-radius: 6px;
      cursor: grab;
    }

    .order-badge img { width: 24px; height: 24px; object-fit: contain; pointer-events: none; }
    .order-badge.dragging { opacity: .45; }
    .order-badge:active { cursor: grabbing; }

    .badge-section + .badge-section {
      margin-top: 14px;
    }

    .badge-section h2 {
      margin: 0 0 8px;
      padding: 0 4px;
      color: #b5bac1;
      font-size: 12px;
      font-weight: 600;
    }

    #badgeList::-webkit-scrollbar {
      width: 6px;
    }
    #badgeList::-webkit-scrollbar-track {
      background: #1e1f22;
    }
    #badgeList::-webkit-scrollbar-thumb {
      background: #2b2d31;
      border-radius: 4px;
    }
    #badgeList::-webkit-scrollbar-thumb:hover {
      background: #4e5058;
    }

    .badge-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 6px;
      background-color: #2b2d31;
      border-radius: 8px;
      cursor: grab;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .badge-item.dragging {
      opacity: 0.5;
    }

    .badge-item:hover {
      background-color: #35363c;
    }

    .badge-item:active {
      cursor: grabbing;
      transform: scale(0.99);
    }

    .badge-item img {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      border-radius: 4px;
      object-fit: contain;
      pointer-events: none;
    }

    .badge-text {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #dbdee1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #80848e;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #23a55a;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; font-size:13px; }
    #languageSelect { max-width:130px; padding:5px 7px; color:#f2f3f5; background:#2b2d31; border:1px solid #4e5058; border-radius:5px; }
    .server-tag-settings { display:grid; gap:8px; margin:0 0 14px; }
    .server-tag-settings > label { display:grid; gap:5px; color:#b5bac1; font-size:12px; }
    .server-tag-settings select, .server-tag-settings input { width:100%; box-sizing:border-box; padding:7px 8px; color:#f2f3f5; background:#2b2d31; border:1px solid #4e5058; border-radius:5px; }
    #categorySelect, .profile-settings input, .profile-settings textarea { width:100%; box-sizing:border-box; padding:7px 8px; color:#f2f3f5; background:#2b2d31; border:1px solid #4e5058; border-radius:5px; }
    #categorySelect { margin-bottom:14px; }
    .settings-panel[hidden] { display:none; }
    .settings-panel { max-height:470px; overflow-y:auto; padding-right:4px; }
    .profile-settings { display:grid; gap:8px; }
    .profile-settings > label { display:grid; gap:5px; color:#b5bac1; font-size:12px; }
    .profile-settings textarea { min-height:90px; resize:vertical; font:inherit; }
    .custom-badge-manager { margin-top:14px; padding:13px 0 0; border-top:1px solid #35363c; }
    .custom-badge-manager h2 { margin:0 0 5px; color:#f2f3f5; font-size:13px; font-weight:650; }
    .custom-badge-note { margin:5px 0 10px; color:#949ba4; font-size:11px; line-height:1.45; }
    .upload-dropzone { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; margin:11px 0 8px; padding:15px 12px; min-height:84px; border:1px dashed #5865f2; border-radius:10px; background:rgba(88,101,242,.08); color:#dbdee1; text-align:center; cursor:pointer; transition:background .15s,border-color .15s,transform .15s; }
    .upload-dropzone:hover, .upload-dropzone.is-dragover { border-color:#8792ff; background:rgba(88,101,242,.18); }
    .upload-dropzone.is-dragover { transform:scale(.99); }
    .upload-dropzone svg { width:23px; height:23px; color:#aeb6ff; }
    .upload-drop-title { font-size:12px; font-weight:650; }
    .upload-drop-hint { color:#949ba4; font-size:10px; line-height:1.4; }
    .upload-toolbar { display:flex; align-items:center; justify-content:flex-end; gap:9px; margin:0 0 9px; }
    .upload-button { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 10px; border:0; border-radius:7px; background:#5865f2; color:#fff; font-size:11px; font-weight:650; cursor:pointer; transition:background .15s,transform .15s; }
    .upload-button:hover { background:#4752c4; }
    .upload-button:active { transform:translateY(1px); }
    .upload-button svg { width:15px; height:15px; }
    #customBadgeFiles, .tooltip-graphic-file { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
    .upload-count { color:#949ba4; font-size:11px; }
    .uploaded-badge-card, .badge-edit-card { margin:0 0 8px; padding:9px; background:#232428; border:1px solid #35363c; border-radius:9px; }
    .badge-editor-top { display:flex; align-items:flex-start; gap:10px; }
    .badge-edit-details { min-width:0; flex:1; }
    .badge-edit-details > summary { display:flex; align-items:center; gap:9px; min-height:32px; list-style:none; cursor:pointer; user-select:none; }
    .badge-edit-details > summary::-webkit-details-marker { display:none; }
    .badge-edit-details > summary:after { content:'▾'; color:#949ba4; margin-left:auto; font-size:12px; transition:transform .15s; }
    .badge-edit-details[open] > summary:after { transform:rotate(180deg); }
    .badge-edit-details > summary img { width:28px; height:28px; flex:none; object-fit:contain; border-radius:5px; }
    .badge-edit-summary-name { min-width:0; overflow:hidden; color:#f2f3f5; font-size:12px; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
    .badge-edit-summary-note { color:#949ba4; font-size:10px; }
    .badge-editor-toggle { flex:none; display:flex; align-items:center; gap:5px; padding-top:5px; color:#b5bac1; font-size:10px; }
    .badge-edit-fields { display:grid; gap:8px; padding:10px 0 1px 37px; }
    .badge-edit-fields > label { display:grid; gap:4px; color:#b5bac1; font-size:10px; }
    .badge-edit-fields > label.badge-edit-style-toggle { display:flex; align-items:center; gap:9px; cursor:pointer; }
    .badge-edit-style-toggle .switch { flex:none; }
    .badge-edit-fields > label.upload-button { display:inline-flex; width:max-content; align-items:center; }
    .badge-edit-fields input[type=text], .badge-edit-fields input[type=url], .badge-edit-fields textarea { width:100%; min-width:0; box-sizing:border-box; padding:7px 8px; color:#f2f3f5; background:#2b2d31; border:1px solid #4e5058; border-radius:6px; font:inherit; font-size:11px; }
    .badge-edit-fields input:focus, .badge-edit-fields textarea:focus { outline:1px solid #5865f2; border-color:#5865f2; }
    .badge-edit-fields textarea { min-height:50px; resize:vertical; }
    .badge-edit-inline { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .tooltip-image-row { display:flex; align-items:center; gap:8px; min-width:0; }
    .tooltip-image-preview { width:34px; height:34px; flex:none; object-fit:contain; background:#1e1f22; border:1px solid #35363c; border-radius:6px; }
    .tooltip-image-row .upload-button { padding:7px 9px; font-size:10px; white-space:nowrap; }
    .badge-editor-actions { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:4px; }
    .badge-editor-actions button { border:0; border-radius:6px; padding:7px 10px; background:#da373c; color:#fff; cursor:pointer; font-size:10px; }
    .badge-editor-save { color:#23a55a; font-size:10px; }
    .settings-row .switch { cursor:pointer; }
    .badge-edit-fields .field-hint { color:#949ba4; font-size:10px; line-height:1.4; }


    /* v1.1.3: compact extension popup layout */
    body { width:360px; padding:12px; font-size:12px; }
    h1 { margin-bottom:12px; padding-bottom:6px; font-size:14px; gap:6px; }
    #badgeList { max-height:330px; padding-right:3px; }
    #enabledBadgeOrder { gap:5px; margin-bottom:10px; padding:8px; min-height:30px; }
    .order-badge { width:30px; height:30px; border-radius:5px; }
    .order-badge img { width:21px; height:21px; }
    .badge-section + .badge-section { margin-top:10px; }
    .badge-section h2 { margin-bottom:6px; font-size:11px; }
    .badge-item { padding:6px 9px; margin-bottom:5px; border-radius:7px; }
    .badge-item img { width:20px; height:20px; margin-right:9px; }
    .badge-text { font-size:12px; }
    .switch { width:32px; height:18px; }
    .slider:before { width:12px; height:12px; left:3px; bottom:3px; }
    input:checked + .slider:before { transform:translateX(14px); }
    .settings-row { gap:9px; margin-bottom:9px; font-size:12px; }
    #languageSelect { padding:4px 6px; font-size:11px; }
    .server-tag-settings { gap:6px; margin-bottom:10px; }
    .server-tag-settings > label, .profile-settings > label { gap:4px; font-size:11px; }
    .server-tag-settings select, .server-tag-settings input,
    #categorySelect, .profile-settings input, .profile-settings textarea { padding:6px 7px; font-size:11px; }
    #categorySelect { margin-bottom:10px; }
    .settings-panel { max-height:440px; padding-right:3px; }
    .profile-settings { gap:6px; }
    .profile-settings textarea { min-height:72px; }
    .custom-badge-manager { margin-top:10px; padding-top:10px; }
    .custom-badge-manager h2 { font-size:12px; }
    .custom-badge-note { margin:4px 0 8px; font-size:10px; }
    .upload-dropzone { gap:5px; margin:8px 0 7px; padding:11px 9px; min-height:68px; border-radius:8px; }
    .upload-dropzone svg { width:20px; height:20px; }
    .upload-drop-title { font-size:11px; }
    .upload-drop-hint { font-size:9px; }
    .upload-toolbar { gap:7px; margin-bottom:7px; }
    .upload-button { gap:5px; padding:6px 8px; font-size:10px; }
    .upload-button svg { width:13px; height:13px; }
    .upload-count { font-size:10px; }
    .uploaded-badge-card, .badge-edit-card { margin-bottom:6px; padding:7px; border-radius:8px; }
    .badge-editor-top { gap:7px; }
    .badge-edit-details > summary { gap:7px; min-height:28px; }
    .badge-edit-details > summary:after { font-size:11px; }
    .badge-edit-details > summary img { width:24px; height:24px; }
    .badge-edit-summary-name { font-size:11px; }
    .badge-edit-summary-note, .badge-editor-toggle { font-size:9px; }
    .badge-edit-fields { gap:7px; padding:8px 0 1px 31px; }
    .badge-edit-fields > label { gap:3px; font-size:9px; }
    .badge-edit-fields input[type=text], .badge-edit-fields input[type=url], .badge-edit-fields textarea { padding:6px 7px; font-size:10px; }
    .badge-edit-fields textarea { min-height:44px; }
    .badge-edit-inline { gap:6px; }
    .tooltip-image-row { gap:6px; }
    .tooltip-image-preview { width:30px; height:30px; }
    .tooltip-image-row .upload-button { padding:6px 7px; font-size:9px; }
    .badge-editor-actions { gap:6px; }
    .badge-editor-actions button { padding:6px 8px; font-size:9px; }
    .badge-editor-save, .badge-edit-fields .field-hint { font-size:9px; }
  </style>
</head>
<body>
  <h1 data-i18n="settings">設定</h1>
  <select id="categorySelect" aria-label="Settings category">
    <option value="general" data-i18n="categoryGeneral">一般設定</option>
    <option value="badges" data-i18n="categoryBadges">バッジ</option>
    <option value="serverTag" data-i18n="categoryServerTag">サーバータグ</option>
    <option value="profile" data-i18n="categoryProfile">プロフィール</option>
  </select>
  <section class="settings-panel" data-category="general">
  <div class="settings-row"><span data-i18n="language">言語</span><select id="languageSelect" aria-label="Language">
    <option value="ja">日本語</option><option value="en">English</option>
  </select></div>
  <div class="settings-row"><span data-i18n="staffMode">スタッフモード</span><label class="switch"><input id="staffModeToggle" type="checkbox" checked><span class="slider"></span></label></div>
  </section>
  <section class="settings-panel" data-category="badges" hidden>
  <div class="settings-row"><span data-i18n="override">バッジを上書き</span><label class="switch"><input id="overrideToggle" type="checkbox" checked><span class="slider"></span></label></div>
  <div class="settings-row"><span data-i18n="badgeOmission">バッジの省略</span><label class="switch"><input id="badgeOmissionToggle" type="checkbox" checked><span class="slider"></span></label></div>
  <div id="enabledBadgeOrder" aria-label="有効なバッジの表示順" title="ドラッグして表示順を変更"></div>
  <div id="badgeList"></div>
  <section class="custom-badge-manager">
    <h2 data-i18n="uploadedBadges">アップロードしたバッジ</h2>
    <p class="custom-badge-note" data-i18n="localOnly">ここで追加したバッジは、このブラウザーのプロフィール表示にだけ反映されます。</p>
    <label id="badgeUploadDropzone" class="upload-dropzone" for="customBadgeFiles" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="upload-drop-title" data-i18n="uploadImages">画像を追加（複数選択可）</span>
      <span class="upload-drop-hint" data-i18n="uploadHint">ここに画像をドラッグ＆ドロップ／クリックして選択 · PNG・JPG・WebP・GIF、5MB以下</span>
    </label>
    <input id="customBadgeFiles" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
    <div class="upload-toolbar"><span id="uploadedBadgeCount" class="upload-count" aria-live="polite"></span></div>
    <div id="uploadedBadgeList"></div>
  </section>
  </section>
  <section class="settings-panel" data-category="serverTag" hidden>
  <div class="server-tag-settings">
    <div class="settings-row"><span data-i18n="serverTagToggle">サーバータグを上書き</span><label class="switch"><input id="serverTagToggle" type="checkbox"><span class="slider"></span></label></div>
    <label><span data-i18n="serverTagBadge">サーバータグのバッジ</span><select id="serverTagBadgeSelect"></select></label>
    <label><span data-i18n="serverTagText">サーバータグの文字</span><input id="serverTagTextInput" type="text" data-i18n-placeholder="serverTagPlaceholder" placeholder="任意の文字"></label>
  </div>
  </section>
  <section class="settings-panel profile-settings" data-category="profile" hidden>
    <div class="settings-row"><span data-i18n="pronounsEnabled">代名詞を上書き</span><label class="switch"><input id="pronounsEnabled" type="checkbox"><span class="slider"></span></label></div>
    <label><span data-i18n="pronounsText">代名詞</span><input id="pronounsText" type="text" maxlength="40" data-i18n-placeholder="profilePlaceholder" placeholder="任意の文字"></label>
    <div class="settings-row"><span data-i18n="usernameEnabled">ユーザー名を上書き</span><label class="switch"><input id="usernameEnabled" type="checkbox"><span class="slider"></span></label></div>
    <label><span data-i18n="usernameText">ユーザー名</span><input id="usernameText" type="text" data-i18n-placeholder="profilePlaceholder" placeholder="任意の文字"></label>
    <div class="settings-row"><span data-i18n="bioEnabled">自己紹介を上書き</span><label class="switch"><input id="bioEnabled" type="checkbox"><span class="slider"></span></label></div>
    <label><span data-i18n="bioText">自己紹介</span><textarea id="bioText" data-i18n-placeholder="profilePlaceholder" placeholder="任意の文字"></textarea></label>
  </section>
  <script src="popup.js"></script>
  <p data-i18n="credit">Made by 清冰みらい</p>
</body>
</html>
